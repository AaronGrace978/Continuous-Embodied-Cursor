name: Electron desktop
on: [push, pull_request]
jobs:
  desktop:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: ui
    env:
      CEC_PYTHON: python
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: ui/package-lock.json
      - run: python -m pip install -e ".[dev,windows]"
        working-directory: .
      - run: npm ci
      - run: npm test
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - name: Electron smoke test (Linux)
        if: runner.os == 'Linux'
        run: xvfb-run -a -s "-screen 0 1440x1100x24" npm run test:electron
        env:
          CEC_ELECTRON_TEST_ARGS: --no-sandbox --disable-gpu
      - name: Electron smoke test (Windows)
        if: runner.os == 'Windows'
        run: npm run test:electron
      - name: Package desktop app
        run: npm run dist
      - name: AppImage smoke test
        if: runner.os == 'Linux'
        run: xvfb-run -a -s "-screen 0 1440x1100x24" npm run test:appimage
        env:
          CEC_ELECTRON_TEST_ARGS: --no-sandbox --disable-gpu
      - name: Preserve desktop diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: desktop-diagnostics-${{ runner.os }}
          path: ui/test-results/
          if-no-files-found: warn
      - uses: actions/upload-artifact@v4
        with:
          name: continuous-cursor-${{ runner.os }}
          path: |
            ui/release/*.exe
            ui/release/*.AppImage
            ui/test-results/*.png
          if-no-files-found: error
