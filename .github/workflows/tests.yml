name: Tests
on: [push, pull_request]
jobs:
  portable:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ['3.10', '3.12']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install -e ".[dev,windows]"
      - run: python -m pytest -q -m "not desktop"
      - run: cec demo
      - name: Native Windows desktop smoke test
        if: runner.os == 'Windows'
        run: python -m pytest -q tests/test_windows_desktop.py
